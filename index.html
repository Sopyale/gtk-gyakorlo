<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Gyakorló kérdésbank az ELTE GTK első féléves tárgyaihoz. Kizárólag saját felhasználásra." />
    <meta name="theme-color" content="#140b13" />
    <link rel="icon" href="/gtk-gyakorlo/favicon.svg" type="image/svg+xml" />
    <title>GTK gyakorló</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try { const t = localStorage.getItem('gtk:theme'); if (t) document.documentElement.dataset.theme = JSON.parse(t); } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
